<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Obtener Información - Thomas Camilo</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <nav class="menu">
    <div class="menu-contenido">
      <span class="logo">TB</span>
      <div class="enlaces">
        <a href="index.html">Inicio</a>
        <a href="contacto.html" class="activo">Contacto</a>
      </div>
    </div>
  </nav>

 
  <main class="principal">
    <header class="titulo-principal">
      <h1>Solicitar Información</h1>
      <p class="subtitulo">Llena este formulario y responderé lo antes posible.</p>
    </header>
    <section class="caja">
      <form action="#" method="POST" class="formulario">
    
        <div class="campo">
          <label for="nombre">Nombre completo</label>
          <input type="text" id="nombre" name="nombre" placeholder="Escribe tu nombre" required minlength="3">
        </div>
        <div class="campo">
          <label for="correo">Correo electrónico</label>
          <input type="email" id="correo" name="correo" placeholder="ejemplo@correo.com" required>
        </div>
        <div class="campo">
          <label for="motivo">Motivo de contacto</label>
          <select id="motivo" name="motivo" required>
            <option value="">-- Selecciona una opción --</option>
            <option value="desarrollo">Desarrollo de Software / Proyectos</option>
            <option value="asesoria">Asesoría Bilingüe</option>
            <option value="general">Información General</option>
          </select>
        </div>
        <div class="campo">
          <label for="mensaje">Mensaje</label>
          <textarea id="mensaje" name="mensaje" rows="4" placeholder="Escribe tu mensaje aquí..." required minlength="10"></textarea>
        </div>

        <button type="submit" class="boton boton-enviar">Enviar</button>
      </form>
    </section>

  </main>
  <footer class="pie">
    <p>© 2026 Thomas Camilo Bernal Jiménez — Bogotá, Colombia</p>
  </footer>

</body>
</html>
